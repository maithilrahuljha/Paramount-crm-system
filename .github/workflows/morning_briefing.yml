name: Morning Briefing - 8:30 AM IST

# Sends the daily sales briefing to Slack + Email every morning at 8:30 AM IST.
# 8:30 AM IST = 3:00 AM UTC (IST is UTC+5:30)

on:
  schedule:
    - cron: '0 3 * * *'  # 8:30 AM IST = 3:00 AM UTC
  workflow_dispatch: {}    # Allow manual runs from the Actions tab

permissions:
  contents: read

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send morning briefing (Slack + Email)
        run: python scripts/send_slack_email.py
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BRIEFING_RECIPIENTS: ${{ secrets.BRIEFING_RECIPIENTS }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
