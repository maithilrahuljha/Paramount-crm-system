name: Hourly KPI Aggregation

# Pulls fresh data from Google Sheets every hour, computes KPIs, and commits
# a lightweight JSON snapshot (data/kpi_snapshot.json) used by the dashboard.

on:
  schedule:
    - cron: '0 * * * *'  # Top of every hour (UTC)
  workflow_dispatch: {}    # Allow manual runs from the Actions tab

permissions:
  contents: write  # Needed to commit the KPI snapshot back to the repo

jobs:
  aggregate-kpis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Aggregate KPIs from Google Sheets
        run: python scripts/google_sheets_connector.py
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}

      - name: Commit KPI snapshot (if changed)
        run: |
          git config user.name "paramount-crm-bot"
          git config user.email "actions@github.com"
          git add data/kpi_snapshot.json docs/data/kpi_snapshot.json || true
          if git diff --cached --quiet; then
            echo "No KPI changes to commit."
          else
            git commit -m "chore: hourly KPI snapshot [skip ci]"
            git push
          fi
